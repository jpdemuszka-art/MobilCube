name: Competitor watch (weekly)

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC = 7:00 in Montreal (EDT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan competitors
        run: python3 tools/competitor-watch/watch.py --suggest
      - name: Commit report
        run: |
          git config user.name "competitor-watch"
          git config user.email "competitor-watch@users.noreply.github.com"
          git add tools/competitor-watch/data tools/competitor-watch/reports
          git diff --cached --quiet || git commit -m "Competitor watch report $(date +%F)"
          git push
